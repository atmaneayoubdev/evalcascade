# Pre-commit hooks. Install once with:  uv run pre-commit install
# Run on everything with:               uv run pre-commit run --all-files
# Keep the ruff rev in sync with the ruff version locked in uv.lock.
minimum_pre_commit_version: "3.8.0"

repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.16.9
    hooks:
      - id: ruff-check
        args: [--fix]
      # Also formats Python code blocks in Markdown, like `ruff format --check .` in CI.
      - id: ruff-format

  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
        args: [--markdown-linebreak-ext=md]
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-toml
      - id: check-added-large-files
        args: [--maxkb=600]
      - id: detect-private-key
        # The Safety metric tests use a fake private-key header on purpose.
        exclude: ^tests/test_metrics\.py$

  - repo: local
    hooks:
      - id: forbid-env-files
        name: forbid committing .env files
        description: .env files hold real secrets. Commit placeholders to .env.example instead.
        entry: ".env files hold secrets and must never be committed (put placeholders in .env.example)"
        language: fail
        files: (^|/)\.env(\.[^/]*)?$
        exclude: (^|/)\.env\.example$
