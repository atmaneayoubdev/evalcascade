[project]
name = "evalcascade"
version = "0.1.0"
description = "Open-source adaptive evaluation for LLM, RAG and agentic systems. System One judges first, LLMs only when necessary."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.12"
authors = [{ name = "EvalCascade contributors" }]
keywords = [
    "llm",
    "evaluation",
    "llm-as-a-judge",
    "rag",
    "agents",
    "llmops",
    "jev",
    "system-one",
    "openrouter",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Software Development :: Quality Assurance",
    "Topic :: Software Development :: Testing",
    "Typing :: Typed",
]
dependencies = [
    "fastapi>=0.115",
    "httpx>=0.27",
    "pydantic>=2.8",
    "python-dotenv>=1.0",
    "rich>=13.7",
    "sqlalchemy>=2.0.30",
    "typer>=0.12",
    "uvicorn>=0.30",
]

[project.urls]
Homepage = "https://github.com/atmaneayoubdev/evalcascade"
Repository = "https://github.com/atmaneayoubdev/evalcascade"
Issues = "https://github.com/atmaneayoubdev/evalcascade/issues"
Changelog = "https://github.com/atmaneayoubdev/evalcascade/blob/main/CHANGELOG.md"

[project.scripts]
evalcascade = "evalcascade.cli.app:main"

[dependency-groups]
dev = [
    "mypy>=1.11",
    "pre-commit>=3.8",
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "pytest-cov>=5.0",
    "respx>=0.21",
    "ruff>=0.6",
]

[build-system]
requires = ["hatchling>=1.26"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/evalcascade"]
# The dashboard bundle is generated (git-ignored) but shipped in the wheel when present.
artifacts = ["src/evalcascade/dashboard_dist/**"]

[tool.hatch.build.targets.sdist]
include = ["src/evalcascade", "README.md", "LICENSE", "CHANGELOG.md", "pyproject.toml"]

# ---------------------------------------------------------------------------
# Tooling
# ---------------------------------------------------------------------------

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]
extend-exclude = ["web"]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle
    "F",   # pyflakes
    "W",   # warnings
    "I",   # isort
    "B",   # bugbear
    "UP",  # pyupgrade
    "SIM", # simplify
    "RUF", # ruff-specific
    "S",   # bandit (security)
    "ASYNC",
    "PT",  # pytest style
    "C4",
]
ignore = [
    "S101",   # asserts are fine in tests and for type narrowing
    "B008",   # Typer/FastAPI use call expressions in defaults
    "RUF012", # ClassVar annotations on pydantic models are handled explicitly
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S", "B011"]
"benchmarks/**" = ["S311"]
"examples/**" = ["S"]

[tool.ruff.format]
quote-style = "double"

[tool.mypy]
python_version = "3.12"
packages = ["evalcascade"]
mypy_path = "src"
strict = true
warn_unreachable = true
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = ["respx.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
addopts = "-ra --strict-markers"
markers = [
    "live: hits real provider APIs; requires keys and EVALCASCADE_LIVE_TESTS=1",
]
filterwarnings = ["error::pytest.PytestUnraisableExceptionWarning"]

[tool.coverage.run]
source = ["evalcascade"]
branch = true
omit = ["src/evalcascade/__main__.py"]

[tool.coverage.report]
show_missing = true
skip_covered = true
exclude_also = [
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
    "@overload",
    "\\.\\.\\.",
]
